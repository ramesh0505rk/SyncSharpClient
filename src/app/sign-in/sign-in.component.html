<div class="signin-container">
    <div class="signin-card d-flex flex-column position-relative justify-content-between">
        <div class="content-header d-flex justify-content-between align-items-center">
            <h1 class="logo-text">Sync#</h1>
            <div class="d-flex signup-btn-container" (click)="onSignUp()" style="cursor: pointer;">
                <a class="signup-btn">Sign Up</a>
            </div>
        </div>
        <div class="content-area d-flex flex-column gap-3">
            <div>
                <h3 style="color: #ffffff;font-weight:700;">Sign In</h3>
                <small style="color: #ffffffc4;font-style: italic;">Please login to continue to your account</small>
            </div>
            <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
                <div class="form-floating mb-3">
                    <input type="text" formControlName="userName" class="form-control" id="floatingInput"
                        placeholder="Username">
                    <label for="floatingInput">* Username</label>
                    <div *ngIf="signInForm.get('userName')?.invalid && signInForm.get('userName')?.touched"
                        class="pt-2 small" style="color: #ffffffc4;">
                        Please enter a valid username.
                    </div>
                </div>
                <div class="form-floating">
                    <input [type]="isPasswordVisible ? 'text' : 'password'" formControlName="password"
                        class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">* Password</label>
                    <img *ngIf="!isPasswordVisible" class="eye-img" src="assets/icons/eye-close.svg"
                        (click)="togglePasswordVisibility()">
                    <img *ngIf="isPasswordVisible" class="eye-img" src="assets/icons/eye-open.svg"
                        (click)="togglePasswordVisibility()">
                </div>
                <div *ngIf="signInForm.get('password')?.invalid && signInForm.get('password')?.touched"
                    class="pt-2 small" style="color: #ffffffc4;">
                    Password must be at least 6 characters long.
                </div>
                <div class="d-flex justify-content-end mt-2">
                    <span (click)="onForgotPasswordClicked()" class="forgot-pass">Forgot password?</span>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-4">Sign
                    In</button>
            </form>
        </div>
    </div>
    <div class="loader-overlay d-flex flex-column justify-content-center align-items-center" *ngIf="isLoading">
        <div class="loader">
            <svg class="hash-svg" viewBox="-20 -20 140 140">
                <path class="hash" stroke="black" fill="none" stroke-width="9" stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m20 40 h60 a1 1 0 0 1 0 20 h-70 a1 1 0 0 1 0 -40 h30 l-10 60 a4 3 0 0 0 30 0 l10 -60" />
            </svg>
        </div>
        <span style="color: #ffffff; font-weight: 400; font-style: italic;">Signing In...</span>
    </div>
</div>
