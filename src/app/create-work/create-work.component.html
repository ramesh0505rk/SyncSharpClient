<div class="create-work-container d-flex flex-column gap-4">
    <div class="header-container d-flex justify-content-between align-items-center">
        <h4 class="heading">Create Work</h4>
        <button class="close-btn align-items-center" (click)="activeModal.close()"><img src="assets/icons/close.svg"
                alt="Close"></button>
    </div>
    <div class="content">
        <form [formGroup]="createWorkForm">
            <div>
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" formControlName="title" class="form-control"
                    placeholder="Enter work title">
            </div>
            <div>
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" formControlName="description" class="form-control"
                    placeholder="Enter work description">
            </div>
            <div>
                <label for="language" class="form-label">Language</label>
                <select id="language" formControlName="language" style="width: 50%;" class="form-control">
                    <option value="">Select a language</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                </select>
            </div>
        </form>
    </div>
    <div class="footer-container d-flex justify-content-end align-items-center gap-3">
        <button class="cancel-btn" (click)="activeModal.close()">Cancel</button>
        <button class="create-btn" [disabled]="!createWorkForm.valid">Create</button>
    </div>
</div>
