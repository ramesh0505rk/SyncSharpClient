<div class="work-editor-container d-flex flex-column">
    <div class="top-bar-container d-flex w-100 justify-content-center align-items-center">
        <div class="top-bar-inner w-100">

        </div>
    </div>
    <div class="workspace-container d-flex align-items-center gap-1">
        <div class="editor-wrapper d-flex flex-column" [style.width.px]="editorWidth">
            <div class="editor-header d-flex align-items-center justify-content-between">
                <div class="title-container d-flex flex-column">
                    <p class="m-0 gradient-text block-select" style="font-weight: 900;">
                        {{work?.title}}</p>
                    <small class="m-0" style="color: #ffffffb3; font-size: 12px;"><span
                            style="font-weight: 600;color: #a6aaf8;">Language:</span> {{
                        work?.language }}</small>
                </div>
                <div class="btn-container">
                    <button class="save-btn d-flex justify-content-center align-items-center" (click)="saveWork()">
                        Save
                    </button>
                </div>
            </div>
            <div class="editor-container">
                <ngx-monaco-editor [options]="editorOptions" (onInit)="onEditorInit($event)">
                </ngx-monaco-editor>
            </div>
        </div>
        <div class="divider" [ngClass]="{'isDragging': isDragging}" (mousedown)="onDragging($event)"></div>
        <div class="output-container d-flex flex-column">
            <div class="header-container d-flex align-items-center justify-content-between">
                <p class="m-0 gradient-text block-select" style="font-weight: 900;">Output</p>
                <button class="run-btn d-flex justify-content-center align-items-center">
                    Run
                </button>
            </div>
            <div class="output-content">
            </div>
        </div>
    </div>
    <!-- <button class="btn btn-primary" (click)="showEditorOptions()">
        Show editor options
    </button> -->
</div>
