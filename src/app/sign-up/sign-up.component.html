<div class="signup-container">
    <div class="signup-card d-flex flex-column gap-4 position-relative justify-content-between">
        <div class="content-header d-flex justify-content-between align-items-center">
            <h1 class="logo-text">Sync#</h1>
            <div class="d-flex signin-btn-container" (click)="onSignIn()" style="cursor: pointer;">
                <a class="signin-btn">Sign In</a>
            </div>
        </div>
        <div class="content-area d-flex flex-column gap-3">
            <div>
                <h3 style="color: #ffffff;font-weight:700;">Sign Up</h3>
                <small style="color: #ffffffc4;font-style: italic;">Please create an account to continue</small>
            </div>
            <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
                <div class="form-floating" style="position: relative;">
                    <input type="text" formControlName="userName" class="form-control" id="floatingUserName"
                        placeholder="name@example.com">
                    <label for="floatingUserName">* User Name</label>
                    <div *ngIf="isCheckingUserName" class="loader" style="position: absolute;"></div>
                </div>
                <div *ngIf="signUpForm.get('userName')?.invalid && signUpForm.get('userName')?.touched"
                    class="pt-2 small" style="color: #ffffffc4;">
                    Please enter a valid user name.
                </div>
                <div *ngIf="userNameTaken" class="pt-2 small" style="color: #f8aac0;">
                    This username is already taken.
                </div>
                <div class="form-floating mt-3 mb-3">
                    <input type="text" formControlName="firstName" class="form-control" id="floatingFirstName"
                        placeholder="name@example.com">
                    <label for="floatingFirstName">* First Name</label>
                    <div *ngIf="signUpForm.get('firstName')?.invalid && signUpForm.get('firstName')?.touched"
                        class="pt-2 small" style="color: #ffffffc4;">
                        Please enter a valid first name.
                    </div>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" formControlName="lastName" class="form-control" id="floatingLastName"
                        placeholder="name@example.com">
                    <label for="floatingLastName">Last Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" formControlName="email" class="form-control" id="floatingEmail"
                        placeholder="name@example.com">
                    <label for="floatingEmail">* Email address</label>
                    <div *ngIf="signUpForm.get('email')?.invalid && signUpForm.get('email')?.touched" class="pt-2 small"
                        style="color: #ffffffc4;">
                        Please enter a valid email address.
                    </div>
                </div>
                <div class="form-floating">
                    <input [type]="isPasswordVisible ? 'text' : 'password'" formControlName="password"
                        class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">* Password</label>
                    <img *ngIf="!isPasswordVisible" class="eye-img" src="assets/icons/eye-close.svg"
                        (click)="togglePasswordVisibility()">
                    <img *ngIf="isPasswordVisible" class="eye-img" src="assets/icons/eye-open.svg"
                        (click)="togglePasswordVisibility()">
                </div>
                <div *ngIf="signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched"
                    class="pt-2 small" style="color: #ffffffc4;">
                    Password must be at least 6 characters long.
                </div>
                <button type="submit" class="btn btn-success w-100 mt-4">Sign
                    Up</button>
            </form>
        </div>
    </div>
</div>
